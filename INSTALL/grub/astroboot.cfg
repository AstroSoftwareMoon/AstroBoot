#************************************************************************************
# AstroBoot tools menu
#
# Shown at the end of the main menu and inside F5 (Tools).
# Extra binaries live on the VTOYEFI partition under /astroboot:
#   memtest86+x64.bin / memtest86+x64.efi   Memtest86+ (GPL-2.0)
#   netboot.xyz.lkrn / netboot.xyz-snp.efi  netboot.xyz iPXE build (GPL-2.0)
#   netboot.xyz.efi                         full iPXE build (compatibility mode)
#************************************************************************************

submenu "$VTLANG_ASTRO_TOOLS" --class=astro_tools {

    set astro_dir=${vtoy_efi_part}/astroboot

    # ------------------------------------------------------------ Memtest86+
    menuentry "$VTLANG_ASTRO_MEMTEST" --class=astro_memtest {
        if [ "$grub_platform" = "pc" ]; then
            if [ -f ${astro_dir}/memtest86+x64.bin ]; then
                echo "Memtest86+ ..."
                linux16 ${astro_dir}/memtest86+x64.bin
                boot
            fi
        elif [ "$grub_cpu" = "x86_64" ]; then
            if [ -f ${astro_dir}/memtest86+x64.efi ]; then
                if vt_check_secureboot_var; then
                    echo -e "\n $VTLANG_ASTRO_SB_NOTE\n"
                fi
                terminal_output console
                chainloader ${astro_dir}/memtest86+x64.efi
                boot
                terminal_output gfxterm
            fi
        else
            echo -e "\n $VTLANG_ASTRO_ONLY_X64\n"
        fi
        echo -en "\n$VTLANG_ENTER_EXIT ..."
        read vtInputKey
    }

    # ------------------------------------------------------------ netboot.xyz
    # UEFI: the SNP build uses the PC's own UEFI network driver and leaves the
    # USB controllers alone, so USB keyboards keep working in its menu.
    menuentry "$VTLANG_ASTRO_NETBOOT" --class=astro_netboot {
        if [ "$grub_platform" = "pc" ]; then
            if [ -f ${astro_dir}/netboot.xyz.lkrn ]; then
                echo "netboot.xyz ..."
                linux16 ${astro_dir}/netboot.xyz.lkrn
                boot
            fi
        elif [ "$grub_cpu" = "x86_64" ]; then
            if [ -f ${astro_dir}/netboot.xyz-snp.efi ]; then
                if vt_check_secureboot_var; then
                    echo -e "\n $VTLANG_ASTRO_SB_NOTE\n"
                fi
                terminal_output console
                chainloader ${astro_dir}/netboot.xyz-snp.efi
                boot
                terminal_output gfxterm
            fi
        else
            echo -e "\n $VTLANG_ASTRO_ONLY_X64\n"
        fi
        echo -en "\n$VTLANG_ENTER_EXIT ..."
        read vtInputKey
    }

    # UEFI fallback: full iPXE build with its own network drivers, for PCs whose
    # firmware does not expose the network card (UEFI "Network Stack" off).
    if [ "$grub_platform" != "pc" -a "$grub_cpu" = "x86_64" ]; then
        menuentry "$VTLANG_ASTRO_NETBOOT_COMPAT" --class=astro_netboot {
            if [ -f ${astro_dir}/netboot.xyz.efi ]; then
                echo -e "\n $VTLANG_ASTRO_NETBOOT_COMPAT_NOTE\n"
                sleep 3
                terminal_output console
                chainloader ${astro_dir}/netboot.xyz.efi
                boot
                terminal_output gfxterm
            fi
            echo -en "\n$VTLANG_ENTER_EXIT ..."
            read vtInputKey
        }
    fi

    # ------------------------------------------------------------ Installed OS finder
    submenu "$VTLANG_ASTRO_DETECT_OS" --class=astro_search {
        set astro_found=0

        if [ "$grub_platform" = "pc" ]; then
            for f in (*)/bootmgr (*)/BOOTMGR (*)/boot/grub/grub.cfg (*)/boot/grub2/grub.cfg (*)/grub/grub.cfg; do
                if [ -f "$f" ]; then
                    regexp --set=1:astro_dev '^\(([^,)]*)' "$f"
                    if [ "$astro_dev" != "$vtoydev" ]; then
                        set astro_found=1
                        if regexp -i 'bootmgr$' "$f"; then
                            regexp --set=1:astro_part '^(\([^)]*\))' "$f"
                            eval "menuentry \"Windows  -  $f\" --class=boot_windows { set root=$astro_part; drivemap -s hd0 $astro_part; ntldr /bootmgr; boot }"
                        else
                            eval "menuentry \"GRUB  -  $f\" --class=boot_disk { configfile $f }"
                        fi
                    fi
                fi
            done
        else
            for f in (*)/EFI/Microsoft/Boot/bootmgfw.efi (*)/EFI/*/shimx64.efi (*)/EFI/*/grubx64.efi (*)/EFI/systemd/systemd-bootx64.efi (*)/EFI/refind/refind_x64.efi (*)/EFI/*/grubaa64.efi (*)/EFI/*/shimaa64.efi; do
                if [ -f "$f" ]; then
                    regexp --set=1:astro_dev '^\(([^,)]*)' "$f"
                    if [ "$astro_dev" != "$vtoydev" ]; then
                        set astro_found=1
                        if regexp 'Microsoft' "$f"; then
                            set astro_cls=boot_windows
                        else
                            set astro_cls=boot_uefi
                        fi
                        eval "menuentry \"$f\" --class=$astro_cls { terminal_output console; chainloader $f; boot; terminal_output gfxterm }"
                    fi
                fi
            done
        fi

        if [ "$astro_found" = "0" ]; then
            menuentry "$VTLANG_ASTRO_NO_OS" --class=astro_search {
                echo ""
            }
        fi

        menuentry "$VTLANG_RETURN_PREVIOUS" --class=vtoyret VTOY_RET {
            echo "Return ..."
        }
    }

    # ------------------------------------------------------------ System information
    menuentry "$VTLANG_ASTRO_SYSINFO" --class=astro_info {
        smbios -t 4 -s 0x10 --set=astro_cpu
        set astro_vendor="-"
        smbios -t 1 -s 0x04 --set=astro_vendor
        set astro_product="-"
        smbios -t 1 -s 0x05 --set=astro_product

        if cpuid -l; then
            set astro_lm="x86_64 (64-bit)"
        else
            set astro_lm="32-bit"
        fi

        vt_push_pager
        echo ""
        echo "  AstroBoot $ASTROBOOT_VERSION  (core Ventoy $VENTOY_VERSION)"
        echo "  ------------------------------------------------------------"
        echo "  Platform        $grub_cpu-$grub_platform"
        if [ "$grub_platform" != "pc" ]; then
            echo "  UEFI            $grub_uefi_version"
            if vt_check_secureboot_var; then
                echo "  Secure Boot     ON"
            else
                echo "  Secure Boot     OFF"
            fi
        fi
        echo "  CPU             $astro_cpu"
        if [ "$grub_cpu" = "x86_64" -o "$grub_cpu" = "i386" ]; then
            echo "  CPU mode        $astro_lm"
        fi
        echo "  RAM             $grub_total_ram MB"
        echo "  Computer        $astro_vendor $astro_product"
        echo "  Video mode      $gfxmode"
        echo ""
        echo "  Disks and partitions"
        echo "  ------------------------------------------------------------"
        ls -l
        echo ""
        if [ "$grub_platform" != "pc" ]; then
            echo "  PCI devices"
            echo "  ------------------------------------------------------------"
            insmod lspci
            lspci
            echo ""
        fi
        vt_pop_pager
        echo -en "\n$VTLANG_ENTER_EXIT ..."
        read vtInputKey
    }

    # ------------------------------------------------------------ Video
    menuentry "$VTLANG_ASTRO_VIDEO" --class=astro_video {
        insmod videoinfo
        vt_push_pager
        videoinfo
        vt_pop_pager
        echo -en "\n$VTLANG_ENTER_EXIT ..."
        read vtInputKey
    }

    # ------------------------------------------------------------ Power
    if [ "$grub_platform" != "pc" ]; then
        menuentry "$VTLANG_POWER_BOOT_EFIFW" --class=debug_efisetup {
            echo -e '\n\n  UEFI setup ...\n'
            sleep 1
            fwsetup
        }
    fi

    menuentry "$VTLANG_POWER_REBOOT" --class=debug_reboot {
        echo -e '\n\n  Reboot ...\n'
        sleep 1
        reboot
    }

    menuentry "$VTLANG_POWER_HALT" --class=debug_halt {
        echo -e '\n\n  Power off ...\n'
        sleep 1
        halt
    }

    # ------------------------------------------------------------ About
    menuentry "$VTLANG_ASTRO_ABOUT" --class=astro_about {
        echo ""
        echo "  AstroBoot $ASTROBOOT_VERSION"
        echo "  https://github.com/AstroSoftwareMoon/AstroBoot"
        echo ""
        echo "  AstroBoot is free software (GPL-3.0), based on Ventoy $VENTOY_VERSION"
        echo "  by longpanda - https://www.ventoy.net"
        echo "  Bundled: GRUB 2, Memtest86+, netboot.xyz / iPXE"
        echo ""
        echo -en "\n$VTLANG_ENTER_EXIT ..."
        read vtInputKey
    }

    menuentry "$VTLANG_RETURN_PREVIOUS" --class=vtoyret VTOY_RET {
        echo "Return ..."
    }
}
