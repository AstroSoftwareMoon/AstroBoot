name: Build AstroBoot

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q mtools dosfstools xz-utils zip unzip

      - name: Build packages
        run: bash astroboot/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: astroboot-packages
          path: |
            astroboot/out/*.tar.gz
            astroboot/out/*.zip
            astroboot/out/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "AstroBoot ${GITHUB_REF_NAME#v}" --notes-file astroboot/RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" astroboot/out/*.tar.gz astroboot/out/*.zip astroboot/out/SHA256SUMS.txt --clobber
